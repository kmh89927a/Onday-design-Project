<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>주소 입력 · 동네궁합</title>
<meta name="description" content="두 직장의 출퇴근 동선이 만나는 후보 동네를 찾아주는 프롭테크 서비스"/>
<meta name="theme-color" content="#2563EB"/>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div class="stage">
  
<nav class="nav-rail" aria-label="화면 이동">
  <a href="login.html">01 로그인</a>
  <a href="diagnosis.html">02 진단</a>
  <a href="result.html">03 결과</a>
  <a href="detail.html">04 상세</a>
  <a href="share.html">05 공유</a>
  <a href="deadline.html">06 데드라인</a>
  <a href="single.html">07 싱글</a>
</nav>
  <div class="phone">
    <div class="phone__island"></div>
    <div class="phone__screen ">
      <div class="phone__statusbar">
        <span>9:41</span>
        <span style="display:flex;gap:6px;align-items:center;">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.5"/><rect x="4.5" y="5" width="3" height="6" rx="0.5"/><rect x="9" y="2.5" width="3" height="8.5" rx="0.5"/><rect x="13.5" y="0" width="3" height="11" rx="0.5"/></svg>
          <svg width="22" height="11" viewBox="0 0 22 11" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="18" height="10" rx="2.5"/><rect x="2" y="2" width="15" height="7" rx="1" fill="currentColor"/><path d="M20 4v3" stroke-linecap="round"/></svg>
        </span>
      </div>
  <main class="screen">
    <div class="topbar">
      <a href="login.html" class="icon-btn" aria-label="이전"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></a>
      <button class="btn btn--sm btn--outline" data-reload-conditions data-label='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/></svg><span style="margin-left:4px">이전 조건 불러오기</span>'>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/></svg><span style="margin-left:4px">이전 조건 불러오기</span>
      </button>
    </div>

    <div class="screen__scroll">
      <div class="diag-head">
        <div class="diag-step">STEP 1 / 2</div>
        <h1 class="diag-title">두 분의 직장 주소를<br/>알려주세요</h1>
        <div class="diag-sub">입력한 주소는 분석 후 자동 삭제돼요</div>
      </div>

      <div class="field-group">
        <label>
          <div class="field-label">내 직장</div>
          <div class="field">
            <div class="field__row">
              <span class="tag tag--a">A</span>
              <span class="field__value">서울 강남구 테헤란로 152</span>
              <span style="color:#10B981" aria-label="확인됨"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
            </div>
          </div>
        </label>

        <label>
          <div class="field-label">배우자 직장</div>
          <div class="field field--focus">
            <div class="field__row">
              <span class="tag tag--b">B</span>
              <input class="field__value-input" type="text" value="판교" autocomplete="off" inputmode="search"/>
              <span style="color:#6B7689"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
            </div>
            <div class="suggest" role="listbox">
              <button class="suggest__row" role="option">
                <span style="color:#6B7689"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></span>
                <div style="flex:1"><div class="suggest__title">판교역</div><div class="suggest__sub">경기 성남시 분당구</div></div>
                <span class="suggest__kind">지하철역</span>
              </button>
              <button class="suggest__row" role="option">
                <span style="color:#6B7689"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></span>
                <div style="flex:1"><div class="suggest__title">판교테크노밸리</div><div class="suggest__sub">경기 성남시 분당구 삼평동</div></div>
                <span class="suggest__kind">지역</span>
              </button>
              <button class="suggest__row" role="option">
                <span style="color:#6B7689"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></span>
                <div style="flex:1"><div class="suggest__title">판교 N사옥</div><div class="suggest__sub">경기 성남시 분당구 정자일로 95</div></div>
                <span class="suggest__kind">회사</span>
              </button>
            </div>
          </div>
        </label>
      </div>

      <div class="mode-grid" data-mode-group>
        <div class="mode-grid__title">진단 모드</div>
        <div class="mode-grid__row">
          <button class="mode-card is-active" type="button">
            <div class="mode-card__emoji">💑</div>
            <div class="mode-card__title">커플 모드</div>
            <div class="mode-card__sub">두 직장 동선 교집합</div>
            <span class="mode-card__check"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
          </button>
          <button class="mode-card" type="button">
            <div class="mode-card__emoji">👤</div>
            <div class="mode-card__title">싱글 모드</div>
            <div class="mode-card__sub">야간 안전 등급 포함</div>
          </button>
        </div>
      </div>

      <div style="height:80px"></div>
    </div>

    <div class="cta-bar">
      <a class="btn btn--full btn--primary" href="result.html">진단 시작 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      <p class="cta-bar__hint">평균 분석 시간 4초 · 후보 6~8개 동네 추천</p>
    </div>
  </main>

    </div>
    <div class="phone__home"></div>
  </div>
</div>
<script src="script.js" defer></script>
</body>
</html>
